<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Weather & Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Your Dashboard Styles */
        .dashboard-container {
            background: radial-gradient(circle at top left, #2980b9, #2c3e50);
            padding: 60px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            align-items: flex-start;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        .glass-card h2 { font-size: 1.4rem; margin-bottom: 25px; text-align: center; }
        .input-box { display: flex; gap: 12px; margin-bottom: 25px; }
        .input-box input { flex: 1; padding: 14px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: white; }
        .glass-card button { padding: 14px 24px; border: none; background: white; color: #2c3e50; font-weight: 600; border-radius: 14px; cursor: pointer; }
        .weather-info { text-align: center; }
        #weather-img { width: 80px; height: 80px; display: none; margin: 10px auto; }
        #display-temp { font-size: 4.5rem; font-weight: 700; margin: 0; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Weather Component -->
        <div class="glass-card">
            <h2>Weather Forecast</h2>
            <form id="weather-form" class="input-box">
                <input type="text" id="city-input" placeholder="Search city..." required>
                <button type="submit" id="search-btn">Search</button>
            </form>
            <div class="weather-info">
                <h1 id="display-city">--</h1>
                <div id="weather-icon"><img id="weather-img" src="" alt="weather"></div> 
                <p id="display-temp">--°C</p>
                <p id="display-desc">--</p>
            </div>
        </div>

        <!-- Todo List Component -->
        <div class="glass-card">
            <h2>Task Manager</h2>
            <form id="todo-form" class="input-box">
                <input type="text" id="todo-input" placeholder="Add a new task...">
                <button type="submit" id="add-todo-btn">Add</button>
            </form>
            <div class="todo-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <ul class="todo-list" id="todo-list-container"></ul>
        </div>
    </div>
    <script type="module" src="app.js" defer></script>
</body>
</html>
